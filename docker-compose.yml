services:
  eval:
    build: .
    container_name: otif
    tty: true
    environment:
      - TERM=xterm-256color
    volumes:
      - /work/alenachao/otif:/otif
      # Change /data/chawutk/otif-dataset to your local path
      - /work/alenachao/data/otif-dataset:/path/to/otif-dataset
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: "host"