services:
  eval:
    build: .
    container_name: otif
    tty: true
    environment:
      - TERM=xterm-256color
    volumes:
      # This checkout, and the OTIF data root (OTIF_DATA, see TETRIS.md), at the paths the run commands use.
      - .:/otif
      - ${OTIF_DATA:?set OTIF_DATA to the OTIF data root}:/path/to/otif-dataset
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: "host"
